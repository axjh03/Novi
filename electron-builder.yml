appId: com.novi.app
productName: Novi
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: 'Novi-${version}-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  artifactName: 'Novi-Setup-${version}.${ext}'
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Utility
  maintainer: 'Novi <getnoviapp@outlook.com>'
  artifactName: '${name}_${version}_${arch}.${ext}'
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
