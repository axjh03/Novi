appId: com.novi.app
productName: Novi
beforePack: scripts/prepare-speech-runtime.mjs
afterPack: scripts/bundle-runtime.mjs
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asarUnpack:
  - node_modules/sherpa-onnx-*/**/*

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: 'Novi-${version}-${arch}.${ext}'
  extendInfo:
    NSAudioCaptureUsageDescription: Novi captures system audio for recordings and local transcription.
    NSMicrophoneUsageDescription: 'Novi requires access to your microphone for voice transcription and audio recording.'
    NSCameraUsageDescription: 'Novi requires access to your camera for vision features and eye-tracking.'
    NSScreenCaptureUsageDescription: 'Novi requires screen recording permission to analyze your active screen content.'
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  artifactName: 'Novi-Setup-${version}.${ext}'
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Utility
  maintainer: 'Novi <getnoviapp@outlook.com>'
  artifactName: '${name}_${version}_${arch}.${ext}'
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
