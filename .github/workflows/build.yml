name: Build and Release Executables (.dmg, .exe, .deb)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.2)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated Release'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with tag
        run: node scripts/sync-version.mjs
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

      - name: Check Windows install script
        if: runner.os == 'Windows'
        run: node --import tsx --test tests/windows-installer.test.ts

      - name: Check Local Coding isolation on this platform
        timeout-minutes: 10
        # The bundled engines must refuse writes and shell access here before anything is published.
        run: node --import tsx --test --test-timeout=120000 tests/local-coding-core.test.ts tests/local-coding-service.test.ts tests/local-coding-engines.test.ts tests/local-coding-process.test.ts
        env:
          NOVI_REQUIRE_ENGINES: '1'

      - name: Build and Package
        run: |
          npm run build
          npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        # Release builds publish these files directly in the next step.
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name == '' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: executables-${{ matrix.os }}
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          body: ${{ inputs.release_notes || '' }}
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
            dist/latest*.yml
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
